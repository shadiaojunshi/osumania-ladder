name: Generate Map Packs

on:
  workflow_dispatch:
    inputs:
      realType:
        description: '指定 realType（留空=全部类型）'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Generate packs
        run: node scripts/generate-pack.js --type=${{ github.event.inputs.realType }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: osumania-ladder-maps
          R2_PACKS_BUCKET: ${{ secrets.R2_PACKS_BUCKET }}
          R2_PACKS_PUBLIC_URL: ${{ secrets.R2_PACKS_PUBLIC_URL }}

      - name: Upload to Google Drive
        if: github.event.inputs.realType == ''
        run: node scripts/upload-to-gdrive.js
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          # Drive 上传从 R2 packs 桶拉流直传(不再依赖本地 output/,generate 已删本地副本)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_PACKS_BUCKET: ${{ secrets.R2_PACKS_BUCKET }}

      - name: Commit manifest
        if: github.event.inputs.realType == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/packs-manifest.json
          git diff --cached --quiet || git commit -m "Update packs manifest" && git push
