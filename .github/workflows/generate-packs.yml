name: Generate Map Packs

on:
  workflow_dispatch:
    inputs:
      realType:
        description: '**留空 = 全量发布（想正常合包就别填这个）**。填某个 realType 就只处理它，且默认只是离线预览、不碰 R2 与清单'
        required: false
        default: ''
      publish:
        description: '**仅在填了 realType 时才有意义**：true = 上传 R2 并只替换该类型的清单条目；false = 仅离线预览。realType 留空时请保持 false'
        required: false
        default: 'false'
      syncDrive:
        description: '单类型发布时是否也同步 Google Drive（默认否）。开了以后只有真正变过的包会上传，代价很小'
        type: boolean
        required: false
        default: false
      allowContentGaps:
        description: '确认有意移除或替换旧谱面，允许数量/内容收缩（不放行缺音频或损坏文件）'
        type: boolean
        required: false
        default: false

# 与 upload-packs-to-drive.yml **共用同一个发布组**：两个 workflow 同时改 R2 / manifest
# 会互相打架（生成与 Drive 重传并发时，后者会照一份中间态的清单去算 Drive 孤儿）。
# cancel-in-progress: false → 后来的排队而不是取消；取消会留下"包已传、清单没更新"的中间态。
concurrency:
  group: packs-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate inputs
        # publish=true 却没有 realType 是**矛盾输入**：全量模式本来就是发布，--publish 只对单类型有意义。
        # CLI 也会拒（exit 2），但那要等 npm ci 跑完之后才看到；这里提前 2 秒给出可操作的说法。
        env:
          REAL_TYPE: ${{ github.event.inputs.realType }}
          PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ] && [ -z "$REAL_TYPE" ]; then
            echo "::error title=输入组合不对::publish=true 必须同时填写 realType。若你只是想做全量发布，把这两个输入都留空/保持默认再跑一次（全量模式默认就是发布）。"
            exit 2
          fi

      - run: npm ci

      - name: Generate packs
        # 输入经 env 传入，再用**双引号包住的变量**作为完整参数，绝不把 `${{ }}` 表达式
        # 直接插进 shell 代码（过去写成 `--type=${{ github.event.inputs.realType }}`，
        # 含空格 / 分号 / 反引号的输入会变成额外的 shell 语法）。
        # 这里用数组逐个传参，输入只会成为**某个参数的值**；再由脚本按 realType 白名单
        # 校验（非法直接 exit 2，且不会执行任何东西）。
        env:
          REAL_TYPE: ${{ github.event.inputs.realType }}
          PUBLISH: ${{ github.event.inputs.publish }}
          ALLOW_CONTENT_GAPS: ${{ github.event.inputs.allowContentGaps }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: osumania-ladder-maps
          R2_PACKS_BUCKET: ${{ secrets.R2_PACKS_BUCKET }}
          R2_PACKS_PUBLIC_URL: ${{ secrets.R2_PACKS_PUBLIC_URL }}
          # 逐张下载 .osz 的并发。脚本默认 8，这里抬到 12（上限 32）——
          # 合包时间几乎都花在"下载 + 解压 + 解析"上，这是不用改架构就能提速的旋钮。
          PACK_DOWNLOAD_CONCURRENCY: '12'
        run: |
          set -euo pipefail
          args=()
          if [ -n "$REAL_TYPE" ]; then args+=("--type=$REAL_TYPE"); fi
          if [ "$PUBLISH" = "true" ]; then args+=("--publish"); fi
          if [ "$ALLOW_CONTENT_GAPS" = "true" ]; then args+=("--allow-content-gaps"); fi
          node scripts/generate-pack.js "${args[@]}"

      - name: Upload to Google Drive
        # 全量发布一定跑。单类型发布(--type + --publish)默认**不**跑 —— 该类型的镜像留给下一次
        # 整套 Drive 重传（清单里的 pendingMirrors 标着这件事）。
        # 2026-09-21 起可以用 syncDrive=true 显式要求单类型也同步：Drive 文件名是内容寻址的，
        # 所以只有内容真的变过的包会上传，代价远小于手动跑整套（那会把清单里 50+ 个包全过一遍）。
        if: github.event.inputs.realType == '' || github.event.inputs.syncDrive == 'true'
        run: node scripts/upload-to-gdrive.js
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          # Drive 上传从 R2 packs 桶拉流直传(不再依赖本地 output/,generate 已删本地副本)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_PACKS_BUCKET: ${{ secrets.R2_PACKS_BUCKET }}

      - name: Commit manifest
        # 全量发布，或单类型发布（--publish）才会改到 manifest；纯预览不该产生提交。
        if: github.event.inputs.realType == '' || github.event.inputs.publish == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/packs-manifest.json
          if git diff --cached --quiet; then
            echo "manifest 没有变化，跳过提交。"
            exit 0
          fi
          git commit -m "Update packs manifest"
          # push 撞上远端新提交时先 rebase 再试，重试次数有上限。
          # **禁止 force push、禁止回滚**：生成结果与错误都保留，由人工处理；
          # 也绝不"用旧 manifest 覆盖" —— 那会把人工维护的链接冲掉。
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 失败（第 $i 次），先同步远端再试"
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::manifest 与远端冲突（可能有人工修改）。已保留本地生成结果与提交，请人工合并；不要用旧 manifest 覆盖。"
              exit 1
            fi
          done
          echo "::error::push 连续失败，已保留本地提交与生成结果。"
          exit 1

      - name: Keep failure artifacts
        # runner 一退出，工作区就没了 —— 上面那句「已保留本地结果」必须靠这个动作兜住
        # （另一条线的审查 P2）。只上传清单与报告，不含任何凭据。
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: pack-publish-debug
          path: |
            data/packs-manifest.json
            data/packs-manifest.previous.json
            reports/pack-identity-report.md
          if-no-files-found: ignore
          retention-days: 7
