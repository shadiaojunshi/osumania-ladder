name: Rebuild TB Packs Only (50 charts max)

on:
  workflow_dispatch:

# Serialize with both existing pack publication and Drive sync.
concurrency:
  group: packs-publish
  cancel-in-progress: false

jobs:
  rebuild-tb:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Save original manifest
        run: cp data/packs-manifest.json "$RUNNER_TEMP/tb-manifest-before.json"
      - name: Rebuild and publish TB only
        run: node scripts/generate-pack.js --type=TB --publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: osumania-ladder-maps
          R2_PACKS_BUCKET: ${{ secrets.R2_PACKS_BUCKET }}
          R2_PACKS_PUBLIC_URL: ${{ secrets.R2_PACKS_PUBLIC_URL }}
          PACK_DOWNLOAD_CONCURRENCY: '4'
      - name: Check that other packs and links are unchanged
        run: node scripts/check-tb-publish-scope.js "$RUNNER_TEMP/tb-manifest-before.json" data/packs-manifest.json
      - name: Sync only TB to Google Drive
        run: node scripts/upload-to-gdrive.js --type=TB
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_PACKS_BUCKET: ${{ secrets.R2_PACKS_BUCKET }}
      - name: Verify scope again and commit manifest
        run: |
          set -euo pipefail
          node scripts/check-tb-publish-scope.js "$RUNNER_TEMP/tb-manifest-before.json" data/packs-manifest.json
          bash scripts/commit-pack-results.sh data/packs-manifest.json
      - name: Keep publication records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb-pack-publication
          path: |
            data/packs-manifest.json
            ${{ runner.temp }}/tb-manifest-before.json
            reports/pack-identity-report.md
          if-no-files-found: ignore
          retention-days: 30
