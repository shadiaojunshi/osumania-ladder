name: Upload Packs to Google Drive (Re-run)

# 不重新生成合包,直接从 R2 packs 桶拉流跑 Drive 上传。
# 用于 Drive 凭据修复后,无需再花 10+ 分钟重跑 Generate Map Packs。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '已生成 packs 的 Generate Map Packs run ID(仅作记录,实际从 R2 读)'
        required: false

# 与 generate-packs.yml **共用同一个发布组**：两边都要改 R2 / manifest，
# 并发时 Drive 侧会照一份中间态的清单去算孤儿（甚至删掉仍在被引用的文件）。
concurrency:
  group: packs-publish
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Upload to Google Drive
        run: node scripts/upload-to-gdrive.js
        env:
          RUN_ID: ${{ github.event.inputs.run_id }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          # Drive 上传从 R2 packs 桶拉流直传(不再依赖本地 output/)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_PACKS_BUCKET: ${{ secrets.R2_PACKS_BUCKET }}

      - name: Commit manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/packs-manifest.json
          if git diff --cached --quiet; then
            echo "manifest 没有变化，跳过提交。"
            exit 0
          fi
          git commit -m "Update packs manifest (drive re-upload)"
          # 同上：push 冲突时先 rebase 再试，**不 force push、不回滚**；
          # 冲突就保留本地结果并报错（人工处理），绝不用旧 manifest 覆盖人工链接。
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 失败（第 $i 次），先同步远端再试"
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::manifest 与远端冲突（可能有人工修改）。已保留本地结果，请人工合并；不要用旧 manifest 覆盖。"
              exit 1
            fi
          done
          echo "::error::push 连续失败，已保留本地提交与生成结果。"
          exit 1

      - name: Keep failure artifacts
        # 与 generate-packs.yml 同一件事：runner 一退出工作区就没了，失败时那句
        # 「已保留本地结果」得靠这个动作兜住。只上传清单，不含任何凭据。
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: drive-sync-debug
          path: |
            data/packs-manifest.json
            data/packs-manifest.previous.json
          if-no-files-found: ignore
          retention-days: 7
