name: Upload Packs to Google Drive (Re-run)

# 不重新生成合包,直接从 R2 packs 桶拉流跑 Drive 上传。
# 用于 Drive 凭据修复后,无需再花 10+ 分钟重跑 Generate Map Packs。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '已生成 packs 的 Generate Map Packs run ID(仅作记录,实际从 R2 读)'
        required: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Upload to Google Drive
        run: node scripts/upload-to-gdrive.js
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          # Drive 上传从 R2 packs 桶拉流直传(不再依赖本地 output/)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_PACKS_BUCKET: ${{ secrets.R2_PACKS_BUCKET }}

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/packs-manifest.json
          git diff --cached --quiet || git commit -m "Update packs manifest (drive re-upload)" && git push
