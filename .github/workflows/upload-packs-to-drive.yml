name: Upload Packs to Google Drive (Re-run)

# 不重新生成合包,只把已有 run 的 artifact 拉下来跑 Drive 上传。
# 用于 Drive 凭据修复后,无需再花 10+ 分钟重跑 Generate Map Packs。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '已生成 packs artifact 的 Generate Map Packs run ID(URL 末段那串数字)'
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Download packs artifact from previous run
        uses: actions/download-artifact@v4
        with:
          name: packs
          path: output
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Google Drive
        run: node scripts/upload-to-gdrive.js
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/packs-manifest.json
          git diff --cached --quiet || git commit -m "Update packs manifest (drive re-upload)" && git push
