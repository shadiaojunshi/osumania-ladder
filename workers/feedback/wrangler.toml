# 反馈 Worker 的配置**样例**。
#
# ⚠️ 本仓库里**没有部署过**这个 Worker，也从未在真实 Cloudflare 账号上验证过。
# 下面的每一项都要在部署前对着账号实际能力核对（见 README.md）。
#
# 部署前最后检查一遍：[[r2_buckets]] / [[durable_objects.bindings]] 里**只有**下面这些。
# 多一个绑定就多一分越权面 —— 这个 Worker 是全站唯一的公开写入口。

name = "osumania-ladder-feedback"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 独立的建议桶。**必须关掉公开读取**（方案第 3 节）。
# 前缀只是个组织方式，不是安全边界：同一个绑定通常能访问整个桶。
[[r2_buckets]]
binding = "SUGGESTIONS"
bucket_name = "osumania-ladder-suggestions"

# 额度协调器（Durable Object）。**没配这个绑定，Worker 一律返回 503、不开放写入** ——
# 这是刻意的：第 4 节说 KV 的 get→加一→put 和共享 counter.json 都不能当原子计数，
# 而"每天最多 300 条"是给用户的承诺，不能在没有原子计数的前提下开放入口。
#
# 启用前先核对当前套餐对 Durable Objects 的支持与定价（第 2 节）。
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCoordinator"
#
[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCoordinator"]

[vars]
# ⚠️ 总开关，**默认关闭**。方案第 9 节第 1 步的前置条件（额度逐项实测、
# 静态路由不触发 Functions、建议桶建好、协调器就位）全部完成后再改成 "true"。
FEEDBACK_WRITES_ENABLED = "false"

# siteverify 要核对的 hostname 与允许的 Origin（精确匹配，逗号分隔）。
TURNSTILE_HOSTNAME = "osumania-ladder.pages.dev"
ALLOWED_ORIGINS = "https://osumania-ladder.pages.dev"

# 用 `wrangler secret put` 设置，**不要**写进这个文件：
#   TURNSTILE_SECRET   —— Turnstile 服务端密钥
#   IP_HASH_SALT       —— IP 哈希的基础盐（代码会按天派生）
#
# ❌ 这个 Worker 不该绑定：LADDER_KV、主 maps 桶、备份桶、GITHUB_TOKEN、SESSION_SECRET、
#    任何邮件密钥。它是公开写入口，拿到的绑定越少越好。
